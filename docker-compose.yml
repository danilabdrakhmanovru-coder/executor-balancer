services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: balancer
      POSTGRES_USER: balancer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balancer -d balancer"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/ExecutorBalancer.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=balancer;Username=balancer;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Integration__ApiKey: ${INTEGRATION_API_KEY:?задайте INTEGRATION_API_KEY в .env}
      Admin__Password: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD в .env}
      # гостевой вход без пароля (кнопка на странице входа): пусто — выключен, Viewer — просмотр, Manager — руководитель
      Admin__GuestRole: ${GUEST_ACCESS:-}
      # через сколько минут без изменений от гостей демо само возвращается в исходное (0 — не возвращать)
      Demo__GuestResetMinutes: ${GUEST_RESET_MINUTES:-30}
      # адрес АИС, куда уходят назначения: в бою — настоящая АИС, на демонстрации — эмулятор
      Ais__BaseUrl: ${AIS_BASE_URL:-http://ais:8080}
      Ais__ApiKey: ${AIS_API_KEY:?задайте AIS_API_KEY в .env}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      # демо-режим: вкладка «Тестовый стенд» и управление эмулятором АИС из интерфейса; в бою — выключен
      Demo__Enabled: ${DEMO_ENABLED:-false}
      # ИИ-разбор заявок (необязательно): модель с OpenAI-совместимым API; без адреса — выключен
      Ai__BaseUrl: ${AI_BASE_URL:-}
      Ai__Model: ${AI_MODEL:-}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__Project: ${AI_PROJECT:-}
      # своя модель без видеокарты отвечает медленно: сколько ждать ответа и сколько слов разрешить в ответе
      Ai__TimeoutSeconds: ${AI_TIMEOUT_SECONDS:-90}
      Ai__MaxTokens: ${AI_MAX_TOKENS:-1500}
      # сайт в интернете: сервис стоит за Caddy и берёт адрес посетителя и https из его заголовков
      Proxy__Enabled: ${PROXY_ENABLED:-false}
    # чтобы из контейнера была видна модель, запущенная на этом же компьютере (Ollama): http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # эмулятор АИС — только для демонстрации: запускается с профилем demo
  # (docker compose --profile demo up, или COMPOSE_PROFILES=demo в .env)
  ais:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: src/AisEmulator.Api/Dockerfile
    environment:
      Balancer__BaseUrl: http://api:8080
      Balancer__ApiKey: ${INTEGRATION_API_KEY}
      Ais__ApiKey: ${AIS_API_KEY}
    ports:
      - "127.0.0.1:8081:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # выход в интернет по HTTPS — только для сервера с доменом: профиль public (COMPOSE_PROFILES=demo,public в .env)
  caddy:
    profiles: ["public"]
    image: caddy:2-alpine
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
